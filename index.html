<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sài Gòn Quest v3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            justify-content: space-between;
        }
        #control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 10px;
        }
        select {
            background-color: #2d2d2d;
            color: #ffb300;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        #stage-header {
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2d2d2d;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            color: #00b894;
            margin-bottom: 5px;
        }
        #viewport {
            flex: 1;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .story-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #fff;
        }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-pre { background-color: #e74c3c; color: white; }
        .badge-training { background-color: #0984e3; color: white; }
        .badge-world { background-color: #00b894; color: white; }
        
        /* Dropdown English translations system styling */
        details {
            background-color: #222;
            border: 1px dashed #555;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        summary {
            cursor: pointer;
            color: #3498db;
            font-weight: bold;
            outline: none;
            user-select: none;
        }
        
        #choice-panel {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        button {
            background-color: #252525;
            color: #fff;
            border: 1px solid #444;
            padding: 14px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            background-color: #333;
        }
        .audio-btn {
            background-color: #6c5ce7;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            text-align: center;
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="control-bar">
        <span style="font-size:0.85rem; color:#aaa;">Chọn màn chơi:</span>
        <select id="level-select" onchange="jumpToLevel(this.value)">
            <option value="0">Lvl 1: Phòng Tập & Đường Phố</option>
            <option value="1">Lvl 2: Quán Ăn Đêm Sài Gòn</option>
            <option value="2">Lvl 3: Văn Phòng Trung Tâm</option>
        </select>
    </div>

    <div id="stage-header">DỮ LIỆU ĐANG TẢI...</div>
    <div id="viewport"></div>
    <div id="choice-panel"></div>
</div>

<script>
    const gameLevels = [
        {
            levelNum: 1,
            title: "MÀN 1: BÌNH THẠNH - PHÒNG TẬP TẠ & ĐƯỜNG PHỐ",
            
            // TASK 1: Pre-Level vocabulary word assessment matrix
            preVocab: [
                { word: "Xài", english: "To use / Spend (Southern dialect)", options: ["To sell", "To use / Spend", "To study"], correct: 1 },
                { word: "Trễ", english: "Late", options: ["Early", "Fast", "Late"], correct: 2 },
                { word: "Bị té", english: "To slip / Fall down by accident", options: ["To fall down", "To repair gear", "To turn right"], correct: 0 }
            ],
            
            // Phase 1 Context Drill (Fully in Vietnamese with English Toggle backing data structures)
            vocabPromptVi: "Bạn đang ở phòng tập tạ (gym) ở Bình Thạnh. Bạn muốn tập trung vào bài tập ngực (chest). Huấn luyện viên bảo bạn phải thực hiện động tác PUSH. Bạn sẽ nói thế nào?",
            vocabPromptEn: "You are at a weightlifting gym in Binh Thanh. You want to focus on a chest routine. The coach tells you to perform a PUSH action. What do you say?",
            optionsVi: ["Đẩy ngực mạnh lên nha anh.", "Kéo cái cùi chỏ ra sau nha anh."],
            correct: 0,
            
            // TASK 3: Multiple consecutive listening tracking cards per stage layer node
            listeningTasks: [
                {
                    promptVi: "Nhiệm vụ nghe 1: Hãy nghe kỹ câu hỏi của huấn luyện viên sau bài tập nặng và chọn nghĩa chính xác:",
                    promptEn: "Listening Task 1: Listen closely to the coach's query after a heavy working set, then choose the correct meaning:",
                    audioText: "Anh có sao không? Tập xong thấy đau chân hay mỏi ngực không anh?",
                    choicesVi: [
                        "He is asking if you are okay and checking if your legs or chest feel painful.",
                        "He is advising you to pack up your gym gear and change your motorbike oil filter."
                    ],
                    correct: 0
                },
                {
                    promptVi: "Nhiệm vụ nghe 2: Bạn đi GrabBike về nhà. Đến nơi, bạn không có tiền mặt và muốn dùng ngân hàng để thanh toán. Hãy nghe kỹ tài xế nói gì:",
                    promptEn: "Listening Task 2: You take a GrabBike home. Upon arrival, you have no cash and want to use online banking. Listen closely to what you ask the driver:",
                    audioText: "Anh ơi cho em chuyển khoản số tài khoản của anh là gì",
                    choicesVi: [
                        "You are stating that the smartphone banking system app has reset unexpectedly.",
                        "You are asking the driver for his account number to perform an instant mobile bank transfer."
                    ],
                    correct: 1
                }
            ],
            
            story: {
                start: {
                    textVi: "Sau khi rời phòng tập, bạn chạy xe vào một con hẻm nhỏ ở Bình Thạnh. Xe của bạn bỗng nhiên bị yếu máy và lốp xe bị mềm. Bạn nhìn thấy một tiệm sửa xe của một chú thợ lớn tuổi.",
                    textEn: "After leaving the gym, you ride into a tight Binh Thanh alley. Your bike suddenly feels weak and the tire goes soft. You spot a repair shop run by an older uncle.",
                    choices: [
                        { textVi: "Nói: 'Chú ơi, bơm bánh xe với thay nhớt dùm con nha Chú.'", target: "shop_success" },
                        { textVi: "Nói: 'Thay vỏ xe nhé! Vào đây!'", target: "shop_clash" }
                    ]
                },
                shop_clash: {
                    textVi: "Sử dụng từ 'nhé' của miền Bắc trong hẻm Sài Gòn nghe rất gượng gạo và giống sách giáo khoa. Chú sửa xe nhìn bạn hơi ngạc nhiên. Hãy thử dùng kính ngữ miền Nam.",
                    textEn: "Using Northern 'nhé' in a Saigon alley sounds stiff and textbook-like. The uncle looks surprised. Try using native Southern softeners.",
                    choices: [{ textVi: "Quay lại nói chuyện tự nhiên hơn", target: "start" }]
                },
                shop_success: {
                    textVi: "Chú sửa xe nhiệt tình làm giúp bạn liền. Trong lúc chờ đợi, trời bỗng đổ mưa giông lớn ngoài đường. Bạn thấy mệt mỏi vì tối qua lỡ thức khuya.",
                    textEn: "The mechanic enthusiastically helps you right away. While waiting, a massive storm downpours outside. You feel exhausted because you stayed up late last night.",
                    choices: [
                        { textVi: "Nói: 'Dạo này em hay thức khuya xài điện thoại nên người vẫn mệt quá chú.'", target: "level_complete" }
                    ]
                },
                level_complete: {
                    textVi: "Chú sửa xe cười rồi nói: 'Xong rồi con! Nhanh khỏe nha con!' Bạn chuyển khoản trả tiền xe rồi chạy về nhà an toàn. Hoàn thành Màn 1!",
                    textEn: "The mechanic smiles: 'All done, son! Get well soon!' You transfer the vehicle funds and ride home safely. Level 1 Complete!",
                    choices: [{ textVi: "Tiến vào Màn 2", target: "next_level_advance" }]
                }
            }
        },
        {
            levelNum: 2,
            title: "MÀN 2: QUÁN ĂN ĐÊM SÀI GÒN (MODULES 1, 2, 5)",
            
            preVocab: [
                { word: "Tóp mỡ", english: "Crunchy pork cracklings / side topping", options: ["Soy sauce", "Pork cracklings", "Pickled veggies"], correct: 1 },
                { word: "Đồ chua", english: "Pickled vegetables served on local dishes", options: ["Chili salt", "Sweet soup", "Pickled vegetables"], correct: 2 },
                { word: "Mặn", english: "Salty profile texture modifier", options: ["Salty", "Sour", "Creamy"], correct: 0 }
            ],
            
            vocabPromptVi: "Bạn muốn gọi thêm một chén mỡ heo chiên giòn để bỏ vào dĩa cơm tấm của mình. Bạn sẽ gọi món gì?",
            vocabPromptEn: "You want to order an extra bowl of crispy deep-fried pork fatback to add to your broken rice plate. What do you ask for?",
            optionsVi: ["Cho con xin thêm nước tương.", "Cho con gọi thêm một chén tóp mỡ nghen."],
            correct: 1,
            
            listeningTasks: [
                {
                    promptVi: "Nhiệm vụ nghe 1: Người phục vụ bàn mang đồ ăn ra và dặn bạn điều này. Hãy nghe kỹ:",
                    promptEn: "Listening Task 1: The food server brings out your plates and gives you this advice. Listen closely:",
                    audioText: "Món gỏi gà này vị hơi mặn, anh nhớ ăn chung với đồ chua cho đỡ ngán nha.",
                    choicesVi: [
                        "They caution that the chicken salad is a bit salty, so remember to eat it with pickled veggies.",
                        "They indicate that the kitchen has run out of fresh local lobsters and cashews."
                    ],
                    correct: 0
                },
                {
                    promptVi: "Nhiệm vụ nghe 2: Bạn muốn mua một ít trái cây làm món tráng miệng từ một xe đẩy ven đường. Hãy nghe người bán tính tiền:",
                    promptEn: "Listening Task 2: You want to purchase fruit for dessert from a roadside cart. Listen to the vendor calculate the bill:",
                    audioText: "Tính hết luôn chuối sứ với hạt điều là năm mươi lăm ngàn chục nha con.",
                    choicesVi: [
                        "The vendor states the total for bananas and cashews is fifty-five thousand VND, utilizing regional counters.",
                        "The vendor requests that you wait ten minutes because the dessert soup is still frozen hot."
                    ],
                    correct: 0
                }
            ],
            
            story: {
                start: {
                    textVi: "Bạn cùng bạn bè ngồi ăn tại một quán nhậu bình dân. Thực đơn có rất nhiều món ăn hấp dẫn từ bình dân như chè đậu xanh đến cao cấp như tôm hùm.",
                    textEn: "You and your friends are dining at an open-air street restaurant. The menu has items ranging from humble mung bean soup to premium lobsters.",
                    choices: [
                        { textVi: "Gọi món: 'Cho con dĩa gỏi gà, thêm chén tóp mỡ béo với nước tương nha.'", target: "meal_flow" }
                    ]
                },
                meal_flow: {
                    textVi: "Bữa ăn cực kỳ ngon miệng! Tuy nhiên, một người bạn cứ liên tục gắp nhầm dĩa thức ăn của người khác do không chú ý.",
                    textEn: "The meal is incredibly delicious! However, one friend keeps accidentally grabbing other people's food plates because they aren't paying attention.",
                    choices: [
                        { textVi: "Nhắc nhở: 'Lấy đồ ăn nhớ nhìn kỹ nha ông bạn, gắp nhầm dĩa của người ta rồi.'", target: "level_complete" }
                    ]
                },
                level_complete: {
                    textVi: "Bạn bè cùng cười vui vẻ. Bữa tối kết thúc thoải mái, mọi người tự trả tiền sòng phẳng rồi ra về. Hoàn thành Màn 2!",
                    textEn: "Everyone laughs together. Dinner concludes comfortably, values are split fairly, and you head back. Level 2 Complete!",
                    choices: [{ textVi: "Tiến vào Màn 3", target: "next_level_advance" }]
                }
            }
        },
        {
            levelNum: 3,
            title: "MÀN 3: VĂN PHÒNG TRUNG TÂM TIẾNG ANH (MODULES 2, 6, 7)",
            
            preVocab: [
                { word: "Siêng", english: "Hardworking / Diligent trait", options: ["Lazy", "Hardworking", "Trendy"], correct: 1 },
                { word: "Sếp", english: "Boss / Chief manager agent", options: ["Colleague", "Student", "Boss"], correct: 2 },
                { word: "Chất lượng", english: "Quality metric index", options: ["Quality", "Schedule", "Reason"], correct: 0 }
            ],
            
            vocabPromptVi: "Bạn muốn khen một câu chuyện đùa vui nhộn của một đồng nghiệp trong phòng hội họp bằng tiếng miền Nam tự nhiên nhất:",
            vocabPromptEn: "You want to praise a funny joke made by a coworker in the meeting room using natural Southern terminology:",
            optionsVi: ["Câu chuyện này mắc cười quá!", "Câu chuyện này bị tịch thu rồi."],
            correct: 0,
            
            listeningTasks: [
                {
                    promptVi: "Nhiệm vụ nghe 1: Quản lý của trung tâm gặp bạn ở hành lang để trao đổi về lịch học kỳ mới. Hãy nghe kỹ:",
                    promptEn: "Listening Task 1: The language center manager meets you in the hallway to discuss the new term schedule. Listen closely:",
                    audioText: "Học kỳ này lớp mình có một bé gái rất thông minh, sếp muốn em tập trung dạy kỹ năng nói cho bé nha.",
                    choicesVi: [
                        "The manager points out that a highly intelligent little girl is in your class, and the boss wants you to target speaking skills.",
                        "The manager requests that you change classrooms because a primary school student accidentally bit a co-worker."
                    ],
                    correct: 0
                },
                {
                    promptVi: "Nhiệm vụ nghe 2: Một người đồng nghiệp khác đang bàn bạc về việc thay đổi thời gian ca dạy. Hãy nghe lý do của họ:",
                    promptEn: "Listening Task 2: Another colleague is discussing changing their teaching shift hours. Listen to their explanation:",
                    audioText: "Em muốn đổi giờ ca dạy ngày mai vì có việc kinh doanh gia đình đột xuất, mong sếp duyệt giúp em.",
                    choicesVi: [
                        "They wish to switch tomorrow's shift hours due to an urgent family business commercial matter.",
                        "They are announcing their formal retirement from the international language center network effective immediately."
                    ],
                    correct: 0
                }
            ],
            
            story: {
                start: {
                    textVi: "Bạn bước vào văn phòng giáo viên của trung tâm. Lịch làm việc trong học kỳ này khá dày đặc. Quản lý (quản lý) gọi bạn lại để kiểm tra giáo trình bài học.",
                    textEn: "You step into the teacher staff room. The class workload this semester is quite packed. The manager calls you over to review your lesson materials.",
                    choices: [
                        { textVi: "Nói: 'Bài học này chất lượng lắm, em đã chuẩn bị kỹ năng giao tiếp gấp đôi cho học sinh rồi.'", target: "admin_clear" },
                        { textVi: "Nói: 'Em muốn đổi giờ bài học buồi này.'", target: "tone_trap" }
                    ]
                },
                tone_trap: {
                    textVi: "🚨 BẪY PHÁT ÂM NGUY HIỂM! Bạn đã dùng nhầm một từ nhạy cảm thô tục thay vì nói buổi học! Không khí văn phòng bỗng lặng đi. Hãy lập tức sửa lại ngữ điệu.",
                    textEn: "🚨 CRITICAL TONAL TRAP! You accidentally slipped a vulgar anatomy word instead of saying class period! The office falls dead silent. Correct your tone tags immediately.",
                    choices: [{ textVi: "Xin lỗi đồng nghiệp và phát âm lại cho đúng", target: "start" }]
                },
                admin_clear: {
                    textVi: "Quản lý gật đầu rất hài lòng và khen bạn là một giáo viên rất siêng năng. Đúng lúc đó, một phụ huynh dắt con đến trung tâm.",
                    textEn: "The manager nods with satisfaction, praising you as a diligent teacher. Right at that moment, a parent brings their child into the center.",
                    choices: [
                        { textVi: "Nói: 'Phụ huynh đang để con ở trung tâm rồi lát nữa quay lại đón bé gái đó Chú.'", target: "campaign_complete" }
                    ]
                },
                campaign_complete: {
                    textVi: "🏆 CHÚC MỪNG BẠN ĐÃ CHIẾN THẮNG V3! Bạn đã vượt qua tất cả các bài kiểm tra từ vựng đơn, xử lý trôi chảy các chuỗi nghe liên tiếp, và làm chủ toàn bộ hệ thống giao tiếp Sài Gòn!",
                    textEn: "🏆 CONGRATULATIONS, YOU HAVE CONQUERED V3! You passed all pre-vocab tests, dominated continuous listening tracks, and commanded the entire Saigon conversational flow masterfully!",
                    choices: [{ textVi: "Chơi lại từ đầu Chiến Dịch", target: "campaign_restart" }]
                }
            }
        }
    ];

    // ----------------------------------------------------
    // STATE ENGINE LOGIC & CONTROL PLATFORM
    // ----------------------------------------------------
    let currentLvlIdx = 0;
    let currentPhase = "pre_vocab_gauntlet"; // pre_vocab_gauntlet -> main_match -> listening_train -> story_fiction
    let preVocabStep = 0;
    let listeningStep = 0;
    let activeStoryNode = "start";

    const view = document.getElementById('viewport');
    const panel = document.getElementById('choice-panel');
    const header = document.getElementById('stage-header');
    const selector = document.getElementById('level-select');

    function initGameProgress() {
        let saved = localStorage.getItem('saigon_v3_level');
        if (saved !== null) {
            currentLvlIdx = parseInt(saved, 10);
            selector.value = currentLvlIdx;
        }
        resetToLevelStart();
    }

    function resetToLevelStart() {
        currentPhase = "pre_vocab_gauntlet";
        preVocabStep = 0;
        listeningStep = 0;
        activeStoryNode = "start";
        engineTick();
    }

    function jumpToLevel(val) {
        currentLvlIdx = parseInt(val, 10);
        localStorage.setItem('saigon_v3_level', currentLvlIdx);
        resetToLevelStart();
    }

    function engineTick() {
        view.innerHTML = '';
        panel.innerHTML = '';
        
        let lvl = gameLevels[currentLvlIdx];
        header.innerText = lvl.title;
        selector.value = currentLvlIdx;

        if (currentPhase === "pre_vocab_gauntlet") {
            buildPreVocabScreen(lvl);
        } else if (currentPhase === "main_match") {
            buildMainMatchScreen(lvl);
        } else if (currentPhase === "listening_train") {
            buildListeningScreen(lvl);
        } else if (currentPhase === "story_fiction") {
            buildStoryScreen(lvl);
        }
    }

    // TASK 1: Pre-level single word testing environment
    function buildPreVocabScreen(lvl) {
        let testWord = lvl.preVocab[preVocabStep];
        let block = document.createElement('div');
        block.className = "story-text";
        block.innerHTML = `<span class="badge badge-pre">KIỂM TRA TỪ VỰNG ĐẦU MÀN (${preVocabStep + 1}/3)</span><br><br>Chọn nghĩa tiếng Anh chính xác cho từ: <strong>"${testWord.word}"</strong>`;
        view.appendChild(block);

        testWord.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.innerText = `${idx + 1}. ${opt}`;
            btn.onclick = () => {
                if (idx === testWord.correct) {
                    alert("Đúng rồi!");
                    preVocabStep++;
                    if (preVocabStep >= lvl.preVocab.length) {
                        alert("Mở khóa màn chơi thành công! Bắt đầu học ngữ cảnh.");
                        currentPhase = "main_match";
                    }
                    engineTick();
                } else {
                    alert(`Chưa chính xác! "${testWord.word}" nghĩa là: ${testWord.english}`);
                }
            };
            panel.appendChild(btn);
        });
    }

    // TASK 2: Immersive Vietnamese questions with English Toggle Dropdowns
    function buildMainMatchScreen(lvl) {
        let block = document.createElement('div');
        block.className = "story-text";
        block.innerHTML = `<span class="badge badge-training">BƯỚC 1: ĐÁNH GIÁ NGỮ CẢNH</span><br><br>${lvl.vocabPromptVi}`;
        
        // English translation drop down system mechanism
        let details = document.createElement('details');
        details.innerHTML = `<summary>Dịch sang tiếng Anh / View English Hint</summary><p style='margin: 8px 0 0 0; color:#3498db;'>${lvl.vocabPromptEn}</p>`;
        block.appendChild(details);
        view.appendChild(block);

        lvl.optionsVi.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.innerText = `${idx + 1}. ${opt}`;
            btn.onclick = () => {
                if (idx === lvl.correct) {
                    alert("Chính xác!");
                    currentPhase = "listening_train";
                    listeningStep = 0;
                    engineTick();
                } else {
                    alert("Chưa đúng! Hãy xem kỹ hành động được yêu cầu.");
                }
            };
            panel.appendChild(btn);
        });
    }

    // TASK 3: Loop holding multiple sequential listening tasks
    function buildListeningScreen(lvl) {
        let task = lvl.listeningTasks[listeningStep];
        let block = document.createElement('div');
        block.className = "story-text";
        block.innerHTML = `<span class="badge badge-training">BƯỚC 2: LUYỆN NGHE LIÊN TIẾP (${listeningStep + 1}/${lvl.listeningTasks.length})</span><br><br>${task.promptVi}`;
        
        let details = document.createElement('details');
        details.innerHTML = `<summary>Dịch ngữ cảnh / View Task English Translation</summary><p style='margin: 8px 0 0 0; color:#3498db;'>${task.promptEn}</p>`;
        block.appendChild(details);
        view.appendChild(block);

        // Native TTS Audio play trigger button
        let audioBtn = document.createElement('button');
        audioBtn.className = "audio-btn";
        audioBtn.innerText = "🔊 BẤM ĐỂ NGHE CÂU NÓI (GIỌNG MIỀN NAM)";
        audioBtn.onclick = () => triggerBrowserSpeech(task.audioText);
        view.appendChild(audioBtn);

        task.choicesVi.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.innerText = `${idx + 1}. ${opt}`;
            btn.onclick = () => {
                if (idx === task.correct) {
                    alert("Tuyệt vời! Nghe chính xác.");
                    listeningStep++;
                    if (listeningStep >= lvl.listeningTasks.length) {
                        alert("Hoàn thành tất cả bài tập nghe! Tiến vào thế giới cốt truyện.");
                        currentPhase = "story_world"; // transition state logic pointer alignment bypass
                        currentPhase = "story_fiction";
                    }
                    engineTick();
                } else {
                    alert("Sai rồi! Hãy bấm nghe lại để nắm bắt từ khóa cốt lõi.");
                }
            };
            panel.appendChild(btn);
        });
    }

    function buildStoryScreen(lvl) {
        let node = lvl.story[activeStoryNode];
        let block = document.createElement('div');
        block.className = "story-text";
        block.innerHTML = `<span class="badge badge-world">BƯỚC 3: TƯƠNG TÁC THẾ GIỚI CỐT TRUYỆN</span><br><br>${node.textVi}`;
        
        let details = document.createElement('details');
        details.innerHTML = `<summary>Dịch cốt truyện / View Narrative Translation</summary><p style='margin: 8px 0 0 0; color:#3498db;'>${node.textEn}</p>`;
        block.appendChild(details);
        view.appendChild(block);

        node.choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.innerText = choice.textVi;
            btn.onclick = () => {
                if (choice.target === "next_level_advance") {
                    currentLvlIdx++;
                    localStorage.setItem('saigon_v3_level', currentLvlIdx);
                    resetToLevelStart();
                } else if (choice.target === "campaign_restart") {
                    currentLvlIdx = 0;
                    localStorage.setItem('saigon_v3_level', currentLvlIdx);
                    resetToLevelStart();
                } else {
                    activeStoryNode = choice.target;
                    engineTick();
                }
            };
            panel.appendChild(btn);
        });
    }

    function triggerBrowserSpeech(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 0.82; // Accessible training rhythm speed modifier
            window.speechSynthesis.speak(utterance);
        } else {
            alert("TTS hardware layer not found.");
        }
    }

    // Boot execution thread sequence allocation
    initGameProgress();
</script>
</body>
