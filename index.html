<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sài Gòn Lesson Quest</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            justify-content: space-between;
        }
        #header-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        #mode-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .badge-vocab { background-color: #d63031; color: white; }
        .badge-reading { background-color: #0984e3; color: white; }
        .badge-listening { background-color: #6c5ce7; color: white; }
        .badge-speaking { background-color: #00b894; color: white; }

        #screen {
            flex: 1;
            background-color: #1a1a1a;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .hp-bar {
            width: 100%;
            background-color: #333;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin: 4px 0;
            border: 1px solid #444;
        }
        .hp-fill {
            height: 100%;
            background-color: #ff4757;
            width: 100%;
            transition: width 0.3s ease;
        }
        #enemy-hp { background-color: #2ed573; }
        #prompt-context {
            color: #aaa;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #dialogue {
            font-size: 1.2rem;
            line-height: 1.5;
            margin: 15px 0;
            color: #fff;
        }
        #controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        button {
            background-color: #252525;
            color: #fff;
            border: 1px solid #444;
            padding: 14px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
            text-align: left;
        }
        button:active {
            background-color: #333;
            transform: scale(0.99);
        }
        .audio-btn {
            background-color: #6c5ce7;
            border-color: #5b4bc4;
            padding: 10px 20px;
            margin-top: 10px;
            text-align: center;
            display: inline-block;
            font-weight: bold;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header-zone">
        <span id="mode-badge" class="badge-vocab">Vocab</span>
        <span id="score-tracking">Quest: <span id="progress-count">1</span>/4</span>
    </div>

    <div id="screen">
        <div style="width: 100%;">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                <span id="enemy-name">Bài Học Monster</span>
                <span id="enemy-hp-text">HP: 100/100</span>
            </div>
            <div class="hp-bar"><div id="enemy-hp" class="hp-fill"></div></div>
        </div>

        <div>
            <div id="prompt-context">Initializing...</div>
            <div id="dialogue">Loading syllabus array...</div>
            <button id="listen-btn" class="audio-btn" style="display:none;">🔊 Nghe (Southern Voice)</button>
        </div>

        <div style="width: 100%;">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                <span>Your Focus (HP)</span>
                <span id="player-hp-text">HP: 100/100</span>
            </div>
            <div class="hp-bar"><div id="player-hp" class="hp-fill"></div></div>
        </div>
    </div>

    <div id="controls">
        <!-- Choices injected dynamically -->
    </div>
</div>

<script>
    // Pure data balanced to hit exactly 25% distribution across all four key skills using your chat data points
    const balancedSyllabus = [
        {
            type: "vocab",
            badgeText: "Single Vocab",
            badgeClass: "badge-vocab",
            enemy: "Vocabulary Warden",
            prompt: "Your teacher Vinh Tran points out that your food tastes exceptionally fatty and rich. What Southern culinary term describes this deep, creamy characteristic?",
            options: [
                "Nước tương (Soy sauce)",
                "Béo (Creamy / Fatty flavor profile)",
                "Đồ chua (Pickled vegetables)",
                "Mặn (Salty food seasoning)"
            ],
            correct: 1
        },
        {
            type: "reading",
            badgeText: "Short Reading",
            badgeClass: "badge-reading",
            enemy: "Context Guardian",
            prompt: "Read this local Southern observation snippet:\n'Bên ngoài trời đang giông bão lớn, sấm sét rất nguy hiểm. Anh ở nhà thôi nghen, đừng đi ra ngoài đường kẻo bị té hoặc cảm bệnh.'\nWhat is the absolute main advice given in this text?",
            options: [
                "You should go to the local market before it gets completely dark.",
                "It is storming dangerously outside, so you must stay home to remain safe.",
                "You need to quickly rent a motorbike to drive through District 1."
            ],
            correct: 1
        },
        {
            type: "listening",
            badgeText: "Listening Activity",
            badgeClass: "badge-listening",
            enemy: "Aural Specter",
            prompt: "Press the audio button to listen carefully to the speaker's medical explanation, then identify the diagnosis mentioned:",
            audioText: "Coi chừng anh bị ngộ độc thực phẩm do sapovirus đó nha.",
            options: [
                "They suspect you are suffering from a chronic case of diabetes (tiểu đường).",
                "They believe you are experiencing acute food poisoning (ngộ độc thực phẩm) from sapovirus.",
                "They are advising you to take care of your teeth (răng) at the dentist."
            ],
            correct: 1
        },
        {
            type: "speaking",
            badgeText: "Speaking Phrasing",
            badgeClass: "badge-speaking",
            enemy: "Pronoun Master",
            prompt: "You want to naturally say goodbye to your wife using informal Southern affectionate speech before heading out to work. Choose the proper phrasing:",
            options: [
                "Anh đi dạy nha chú rể.",
                "Anh đi dạy nha bà xã.",
                "Con xin phép đi về nghen ông xã."
            ],
            correct: 1,
            audioText: "Anh đi dạy nha bà xã."
        }
    ];

    let currentIdx = 0;
    let playerHP = 100;
    let enemyHP = 100;

    function renderActiveRound() {
        if (currentIdx >= balancedSyllabus.length) {
            document.getElementById('dialogue').innerHTML = "🎯 Perfect Score! Your lesson review is complete. You successfully handled vocab, reading chunks, listening, and speaking modules equally!";
            document.getElementById('controls').innerHTML = `<button style="text-align:center;" onclick="restartSyllabus()">Restart Review Iteration</button>`;
            return;
        }

        const turnData = balancedSyllabus[currentIdx];
        
        // Update skill framework UI tracking markers
        const badge = document.getElementById('mode-badge');
        badge.innerText = turnData.badgeText;
        badge.className = ''; 
        badge.classList.add(turnData.badgeClass);

        document.getElementById('enemy-name').innerText = turnData.enemy;
        document.getElementById('progress-count').innerText = currentIdx + 1;
        document.getElementById('prompt-context').innerText = `Module Structure: ${turnData.type.toUpperCase()}`;
        document.getElementById('dialogue').innerText = turnData.prompt;

        const listenBtn = document.getElementById('listen-btn');
        const controls = document.getElementById('controls');
        controls.innerHTML = '';

        if (turnData.type === "listening") {
            listenBtn.style.display = 'block';
            listenBtn.onclick = () => playVinhAudio(turnData.audioText);
        } else {
            listenBtn.style.display = 'none';
        }

        turnData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => evaluateChoice(index === turnData.correct);
            controls.appendChild(btn);
        });
    }

    function evaluateChoice(success) {
        if (success) {
            enemyHP -= 100; // Step cleanly past the current balance target node
            alert("Chính xác! Excellent answer choice.");
        } else {
            playerHP -= 25;
            alert("Chưa đúng! Your memory focus slips slightly.");
        }

        document.getElementById('enemy-hp').style.width = `${Math.max(0, enemyHP)}%`;
        document.getElementById('enemy-hp-text').innerText = `HP: ${Math.max(0, enemyHP)}/100`;
        document.getElementById('player-hp').style.width = `${Math.max(0, playerHP)}%`;
        document.getElementById('player-hp-text').innerText = `HP: ${Math.max(0, playerHP)}/100`;

        if (playerHP <= 0) {
            document.getElementById('dialogue').innerText = "Focus depleted! Review your notes from Vinh Tran and try again.";
            document.getElementById('controls').innerHTML = `<button style="text-align:center;" onclick="restartSyllabus()">Try Again</button>`;
            return;
        }

        if (enemyHP <= 0) {
            currentIdx++;
            enemyHP = 100;
            setTimeout(renderActiveRound, 400);
        }
    }

    function playVinhAudio(phrase) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const speechUnit = new SpeechSynthesisUtterance(phrase);
            speechUnit.lang = 'vi-VN';
            speechUnit.rate = 0.82; // Accessible learning cadence
            window.speechSynthesis.speak(speechUnit);
        } else {
            alert("Text-to-speech module not found on this interface.");
        }
    }

    function restartSyllabus() {
        playerHP = 100;
        enemyHP = 100;
        currentIdx = 0;
        document.getElementById('enemy-hp').style.width = '100%';
        document.getElementById('player-hp').style.width = '100%';
        document.getElementById('enemy-hp-text').innerText = "HP: 100/100";
        document.getElementById('player-hp-text').innerText = "HP: 100/100";
        renderActiveRound();
    }

    // Launch instant execution loop
    renderActiveRound();
</script>
</body>
</html>
