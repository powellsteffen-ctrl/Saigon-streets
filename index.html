<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sài Gòn Chronicles: Interactive Catalog</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            justify-content: space-between;
        }
        #control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 10px;
        }
        select {
            background-color: #2d2d2d;
            color: #ffb300;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        #stage-header {
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2d2d2d;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            color: #00b894;
            margin-bottom: 5px;
        }
        #viewport {
            flex: 1;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .story-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #fff;
        }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-training { background-color: #0984e3; color: white; }
        .badge-world { background-color: #00b894; color: white; }
        .badge-bonus { background-color: #e67e22; color: white; }
        #choice-panel {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        button {
            background-color: #252525;
            color: #fff;
            border: 1px solid #444;
            padding: 14px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            background-color: #333;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="control-bar">
        <span style="font-size:0.85rem; color:#aaa;">Jump to Level:</span>
        <select id="level-select" onchange="jumpToLevel(this.value)">
            <option value="0">Lvl 1: Bình Thạnh Alleyway</option>
            <option value="1">Lvl 2: Quán Nhậu Market</option>
            <option value="2">Lvl 3: Language Center Hub</option>
            <option value="3">⭐ Lvl 4: BONUS Cumulative Review</option>
            <option value="4">Lvl 5: The Advanced Street Routine</option>
            <option value="5">Lvl 6: Corporate Operations</option>
            <option value="6">Lvl 7: Semester Final Day</option>
        </select>
    </div>

    <div id="stage-header">LOADING FRAMEWORK...</div>
    <div id="viewport"></div>
    <div id="choice-panel"></div>
</div>

<script>
    // ----------------------------------------------------
    // COMPREHENSIVE 7-LEVEL STORY MATRIX DATA ASSET
    // ----------------------------------------------------
    const gameLevels = [
        {
            levelNum: 1,
            title: "LEVEL 1: BÌNH THẠNH ALLEYWAY (MODULES 1, 3, 4)",
            vocabPrompt: "A mechanic looks at your bike. You want to ask an older uncle (Chú) politely to inflate your flat tire. What is your modifier?",
            options: ["Bơm bánh xe dùm em.", "Bơm bánh xe dùm con.", "Thay vỏ xe nhé."],
            correct: 1,
            fillPrompt: "Fill in the blank tracking your accident status parameter:<br><br>'Đường nhỏ này trơn quá, hồi nãy đi nhanh em bị __________ đau chân.'",
            fillOptions: ["vào", "chỉ", "bị té"],
            fillCorrect: 2,
            story: {
                start: {
                    text: "You are cruising through a tight alleyway in Bình Thạnh when you realize your engine feels sluggish and you hit heavy gridlock. You locate a mechanical shop marker.",
                    choices: [
                        { text: "Pull in and ask: 'Thay nhớt với lọc nhớt dùm em nha.'", target: "shop_success" },
                        { text: "Pull in and shout: 'Chào nhé! Vào đây!'", target: "shop_clash" }
                    ]
                },
                shop_clash: {
                    text: "Using Northern 'nhé' in a Saigon alleyway sounds awkward and textbook-ish. The local mechanic looks slightly taken aback. Let's adapt our tone accent.",
                    choices: [{ text: "Re-initiate dialogue tree", target: "start" }]
                },
                shop_success: {
                    text: "The mechanic smiles, nods, and swaps your oil ('thay nhớt'). As you wait, a sudden storm rolls in. The weather turns bad and you feel run down from staying up late.",
                    choices: [
                        { text: "Say: 'Dạo này em hay thức khuya xài điện thoại nên người vẫn mệt.'", target: "victory" },
                        { text: "Say: 'Em chỉ muốn đi vệ sinh trúng thực thôi.'", target: "shop_weird" }
                    ]
                },
                shop_weird: {
                    text: "That phrase makes it sound like you WANT food poisoning! Focus on your baseline stamina traits instead.",
                    choices: [{ text: "Re-phrase status description", target: "shop_success" }]
                },
                victory: {
                    text: "The mechanic handles your bike flawlessly. 'Nhanh khỏe nha con!' he waves. You survive the alley adventure!",
                    choices: [{ text: "Move to Level 2", target: "next_level_advance" }]
                }
            }
        },
        {
            levelNum: 2,
            title: "LEVEL 2: THE QUÁN NHẬU MARKET (MODULES 1, 2, 5)",
            vocabPrompt: "Which of these terms describes crunchy pork fatback cubes added as a rich topping?",
            options: ["Nước tương", "Đồ chua", "Tóp mỡ"],
            correct: 2,
            fillPrompt: "Complete this flavor-balancing custom profile request:<br><br>'Món gỏi gà này __________ quá, lấy thêm đồ chua cho đỡ ngán.'",
            fillOptions: ["mặn", "bột", "chè"],
            fillCorrect: 0,
            story: {
                start: {
                    text: "You sit down at a popular late-night spot with friends. The menu lists premium luxury options like lobster (tôm hùm) and local street variables.",
                    choices: [
                        { text: "Order: 'Cho con dĩa gỏi gà với thêm chén tóp mỡ và nước tương nha.'", target: "feast_time" },
                        { text: "Order: 'Lấy cho con một tô chè đậu xanh muối ớt nhiều bột.'", target: "chef_confused" }
                    ]
                },
                chef_confused: {
                    text: "Mung bean sweet soup combined with chili salt and raw seasoning powder sounds chaotic! The server stares blankly. Let's fix our food inventory targets.",
                    choices: [{ text: "Re-order food modifications", target: "start" }]
                },
                feast_time: {
                    text: "The food is spectacular! Your friends bring out fresh local fruits with chili salt (muối ớt) and a bag of premium local cashews (hạt điều). You check your watch—it's getting late.",
                    choices: [
                        { text: "Say: 'Bữa ăn này ngon quá, cơ mà trễ rồi, em không muốn thức khuya.'", target: "victory" },
                        { text: "Say: 'Hạt điều này muốn xài bài học rất giàu.'", target: "friend_lost" }
                    ]
                },
                friend_lost: {
                    text: "You mixed your tone arrays! Combining vocabulary blueprints with structural lesson keywords makes your friends completely lose track of the conversation.",
                    choices: [{ text: "Re-state your departure line", target: "feast_time" }]
                },
                victory: {
                    text: "You wrap up the meal cleanly, pay the tab, and head home fully recharged. Level 2 Complete!",
                    choices: [{ text: "Move to Level 3", target: "next_level_advance" }]
                }
            }
        },
        {
            levelNum: 3,
            title: "LEVEL 3: LANGUAGE CENTER HUB (MODULES 2, 6, 7)",
            vocabPrompt: "What is the critical tonal difference for 'Lesson Content/Blueprint' (Low Falling Tone)?",
            options: ["Buồi", "Bài học", "Buổi học"],
            correct: 1,
            fillPrompt: "Complete the administration shift request phrase:<br><br>'Dạo này em bận quá, sếp cho em __________ giờ lớp này được không sếp?'",
            fillOptions: ["hợp", "đổi", "siêng"],
            fillCorrect: 1,
            story: {
                start: {
                    text: "You enter the language center branch. The operations staff looks stressed trying to manage academic course schedules. Your manager (quản lý) stops you to double-check a curriculum layout.",
                    choices: [
                        { text: "Say: 'Bài học này chất lượng lắm, em nghĩ học kỳ này học sinh sẽ rất thích.'", target: "admin_win" },
                        { text: "Say: 'Em muốn đổi giờ bài học buồi này.'", target: "vulgarity_trap" }
                    ]
                },
                vulgarity_trap: {
                    text: "🚨 CRITICAL TONAL TRAP FIRED! You accidentally used a highly offensive vulgarity instead of saying class session! The office staff gasps. Instantly reload your safety profile.",
                    choices: [{ text: "Apologize immediately and correct your tone", target: "start" }]
                },
                admin_win: {
                    text: "The manager nods with relief. She commends you for being incredibly hardworking (siêng) and professional (chuyên nghiệp). Suddenly, a father approaches the front counter.",
                    choices: [
                        { text: "Observe: 'Chú đó đang muốn để con ở trung tâm rồi chiều quay lại đón.'", target: "victory" },
                        { text: "Observe: 'Người lạ đó đang muốn kinh doanh hiểu sai rất giàu.'", target: "clerk_lost" }
                    ]
                },
                clerk_lost: {
                    text: "That phrase makes you sound like a suspicious data broker! Let's pick a clear, practical classroom management observation.",
                    choices: [{ text: "Re-evaluate parental action", target: "admin_win" }]
                },
                victory: {
                    text: "You settle the class logistics cleanly. You are maintaining stellar rapport across the staff room. Level 3 Complete!",
                    choices: [{ text: "Unlock Level 4 Bonus Review", target: "next_level_advance" }]
                }
            }
        },
        {
            levelNum: 4,
            title: "⭐ LEVEL 4: BONUS CUMULATIVE REVIEW (MODULES 1 - 7)",
            vocabPrompt: "Review Checkpoint: Identify the colloquial HCMC street slang for 'Food Poisoning' from your recovery notes:",
            options: ["Ngộ độc thực phẩm", "Trúng thực", "Hiểu sai"],
            correct: 1,
            fillPrompt: "Review Checkpoint: Fill in the missing conversational particle mapping to iconic Saigon dialogue closers:<br><br>'Em vừa mới sửa xe xong nè, bây giờ chạy qua trung tâm gặp đồng nghiệp luôn __________.'",
            fillOptions: ["nhé", "nha", "vào"],
            fillCorrect: 1,
            story: {
                start: {
                    text: "GRAND MATRIX REVIEW: You are charting a massive day. You need to pick up a tire part, grab a street lunch, and coordinate hours with your boss (sếp) without hitting tonal barriers.",
                    choices: [
                        { text: "Plan: 'Tính đi thay nhớt, ăn dĩa cơm tấm tóp mỡ rồi qua trung tâm đổi giờ dạy.'", target: "review_victory" },
                        { text: "Plan: 'Mình muốn trúng thực vào buổi học buồi này.'", target: "review_disaster" }
                    ]
                },
                review_disaster: {
                    text: "You triggered multiple tone errors and combined the vulgarity trap with food poisoning parameters! Focus your baseline catalog markers.",
                    choices: [{ text: "Clear mind and re-initialize blueprint paths", target: "start" }]
                },
                review_victory: {
                    text: "🎉 BONUS MILESTONE MET! You locked down items from all prior modules perfectly without crashing into semantic deadlocks. The gateway to advanced tiers is now unlocked!",
                    choices: [{ text: "Advance to Level 5", target: "next_level_advance" }]
                }
            }
        },
        {
            levelNum: 5,
            title: "LEVEL 5: THE ADVANCED STREET ROUTINE (MODULES 1, 3, 5)",
            vocabPrompt: "What specific regional variation item is a 'Chuối sứ'?",
            options: ["A specific local banana variety used in cooking", "A type of sweet mung bean broth", "A specialized mechanical socket wrench tool"],
            correct: 0,
            fillPrompt: "Complete the local market transaction prompt:<br><br>'Trái cây này ngon quá, bán cho con một __________ chuối sứ ăn thử nha.'",
            fillOptions: ["chục (ten units)", "vỏ xe", "bột"],
            fillCorrect: 0,
            story: {
                start: {
                    text: "You are running weekend food preparation errands. You park your bike near a sprawling street layout. An elder lady is slicing up ingredients next to a cart profile.",
                    choices: [
                        { text: "Ask: 'Dì ơi, chuối sứ này bao nhiêu một chục vậy dì? Có được giảm giá không?'", target: "market_win" },
                        { text: "Ask: 'Bơm bánh xe cái chuối sứ này dùm con vào nhé.'", target: "market_fail" }
                    ]
                },
                market_fail: {
                    text: "Pumping air into a banana makes no logical sense! The street vendor laughs at your mixed-up nouns. Let's fix our shopping tags.",
                    choices: [{ text: "Re-state product question", target: "start" }]
                },
                market_win: {
                    text: "She hooks you up with a magnificent bunch and even adds an extra snack free of charge ('miễn phí'). You load the items into your storage box, ready to head back before dark.",
                    choices: [
                        { text: "Con xin phép đi về nha dì, chúc dì bán đắt hàng nghen!", target: "victory" },
                        { text: "Con muốn thay vỏ xe nước tương này.", target: "market_weird" }
                    ]
                },
                market_weird: {
                    text: "Putting soy sauce on your tire shell is highly dangerous street behavior! Let's exit with natural polite softeners instead.",
                    choices: [{ text: "Use conversational soften options", target: "market_win" }]
                },
                victory: {
                    text: "You navigate back down the block seamlessly. Your food stock parameters are looking incredible. Level 5 Cleared!",
                    choices: [{ text: "Move to Level 6", target: "next_level_advance" }]
                }
            }
        },
        {
            levelNum: 6,
            title: "LEVEL 6: CORPORATE OPERATIONS (MODULES 2, 6)",
            vocabPrompt: "What does the commercial business expression 'Kinh doanh' imply?",
            options: ["To trade / Execute business activities", "To retire from a job profile", "To stay up late correcting homework files"],
            correct: 0,
            fillPrompt: "Complete the administration structural alignment update:<br><br>'Team mình muốn phát triển mảng _________ này nên cần tìm người có kinh nghiệm.'",
            fillOptions: ["hiểu sai", "kinh doanh", "buồi"],
            fillCorrect: 1,
            story: {
                start: {
                    text: "You are attending a high-level coordination sync with school administrators. The focus turns to evaluating team synergy (hợp), expansion, and commercial quality parameters.",
                    choices: [
                        { text: "Suggest: 'Nếu muốn tăng chất lượng, đồng nghiệp cần có nhiều thời gian chuẩn bị hơn.'", target: "meeting_win" },
                        { text: "Suggest: 'Sếp ơi, em nghĩ mình nên hiểu sai lý do nghỉ hưu dữ dội.'", target: "meeting_fail" }
                    ]
                },
                meeting_fail: {
                    text: "Suggesting that the team should actively misunderstand why people retire will get you a very strange look from HR. Let's provide solid performance feedback.",
                    choices: [{ text: "Re-phrase operational feedback", target: "start" }]
                },
                meeting_win: {
                    text: "The director takes notes on your input. Your points match their long-term growth charts. They mention that an international credential update program is launching soon.",
                    choices: [
                        { text: "Say: 'Dạ, em luôn cố gắng học hỏi để làm việc chuyên nghiệp hơn.'", target: "victory" },
                        { text: "Say: 'Em muốn đổi giờ thức khuya sang ban ngày.'", target: "meeting_absurd" }
                    ]
                },
                meeting_absurd: {
                    text: "You cannot change the time of staying up late to the daytime! That defies physics. Focus your professional dialogue selections.",
                    choices: [{ text: "Re-state professional commitment", target: "meeting_win" }]
                },
                victory: {
                    text: "The management tracking index updates beautifully. You're solidified as an invaluable pillar of the school team. Level 6 Cleared!",
                    choices: [{ text: "Move to Level 7 Final Stage", target: "next_level_advance" }]
                }
            }
        },
        {
            levelNum: 7,
            title: "LEVEL 7: SEMESTER FINAL DAY (MODULES 2, 7)",
            vocabPrompt: "Identify the tracking keyword that translates directly to 'Double / Twice the output multiplier':",
            options: ["Gấp đôi", "Nhỏ", "Tuổi"],
            correct: 0,
            fillPrompt: "Complete the final classroom safety sequence sentence:<br><br>'Mấy đứa nhỏ hiếu động quá, chạy nhanh trong trung tâm dễ __________ lắm đó nha.'",
            fillOptions: ["học kỳ", "bị té", "quốc tế"],
            fillCorrect: 1,
            story: {
                start: {
                    text: "It is the final day of the summer term session. The classroom is packed with highly energetic young primary student NPCs. A little girl (bé gái) is jumping around near the front row seating locations.",
                    choices: [
                        { text: "Instruct: 'Mấy con ngoan ngoãn ngồi xuống ghế nha, đừng chạy nhảy kẻo bị té đó.'", target: "class_safe" },
                        { text: "Instruct: 'Con hãy cắn gấp đôi thời gian học kỳ quốc tế nhé!'", target: "class_chaos" }
                    ]
                },
                class_chaos: {
                    text: "Telling a primary student to bite down twice as hard on an international semester is an absolute nightmare command loop! Stop the chaos and issue a stable safety instruction.",
                    choices: [{ text: "Re-issue safety command arrays", target: "start" }]
                },
                class_safe: {
                    text: "The kids sit down cleanly ('ngồi xuống'). They look incredibly smart (thông minh). The parents show up at the center doors to pick up their children ('đón con') for summer break.",
                    choices: [
                        { text: "Tell them: 'Chúc phụ huynh và mấy bé có một kỳ nghỉ hè vui vẻ và hạnh phúc nghen!'", target: "campaign_complete" },
                        { text: "Tell them: 'Học sinh này dạo này siêng thức khuya xài lọc nhớt lắm.'", target: "parents_lost" }
                    ]
                },
                parents_lost: {
                    text: "Telling a parent that their child stays up late playing with mechanic shop oil filters will spark a massive administrative inquiry! Reset your conversational track to warm holiday greetings.",
                    choices: [{ text: "Re-state warm holiday parting lines", target: "class_safe" }]
                },
                campaign_complete: {
                    text: "🏆 THE ULTIMATE CAMPAIGN IS CONCLUDED! You have seamlessly integrated all 7 modules, broken through the tone traps, mastered situational dialog, and built functional communication safety nets. Sài Gòn is officially your playground!",
                    choices: [{ text: "Restart Master Adventure Loop", target: "loop_reset" }]
                }
            }
        }
    ];

    // ----------------------------------------------------
    // STATE ENGINE WITH PERSISTENT LOCAL STORAGE SAVES
    // ----------------------------------------------------
    let activeIndex = 0;
    let activePhase = "training_match"; 
    let activeStoryNode = "start";

    const view = document.getElementById('viewport');
    const panel = document.getElementById('choice-panel');
    const header = document.getElementById('stage-header');
    const selector = document.getElementById('level-select');

    // Load saved progress from local browser storage on boot up
    function initProgressSaveState() {
        let savedLvl = localStorage.getItem('saigon_quest_level');
        if (savedLvl !== null) {
            activeIndex = parseInt(savedLvl, 10);
            selector.value = activeIndex;
        }
        activePhase = "training_match";
        activeStoryNode = "start";
        runEngineTick();
    }

    // Triggered manually when the player alters the dropdown menu box selection configuration
    function jumpToLevel(val) {
        activeIndex = parseInt(val, 10);
        localStorage.setItem('saigon_quest_level', activeIndex);
        activePhase = "training_match";
        activeStoryNode = "start";
        runEngineTick();
    }

    function runEngineTick() {
        view.innerHTML = '';
        panel.innerHTML = '';
        
        let currentLvl = gameLevels[activeIndex];
        header.innerText = currentLvl.title;
        selector.value = activeIndex; // sync UI selector state

        if (activePhase === "training_match") {
            executeMatchLayout(currentLvl);
        } else if (activePhase === "training_fill") {
            executeFillLayout(currentLvl);
        } else if (activePhase === "world_story") {
            executeStoryLayout(currentLvl);
        }
    }

    function executeMatchLayout(lvl) {
        let block = document.createElement('div');
        block.className = "story-text";
        block.innerHTML = `<span class="badge badge-training">Step 1: Term Definition Check</span><br><br>${lvl.vocabPrompt}`;
        view.appendChild(block);

        lvl.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.innerText = `${idx + 1}. ${opt}`;
            btn.onclick = () => {
                if (idx === lvl.correct) {
                    alert("Đúng rồi! Perfect conceptual match.");
                    activePhase = "training_fill";
                    runEngineTick();
                } else {
                    alert("Chưa đúng! Re-examine tonal differences or dictionary tags.");
                }
            };
            panel.appendChild(btn);
        });
    }

    function executeFillLayout(lvl) {
        let block = document.createElement('div');
        block.className = "story-text";
        block.innerHTML = `<span class="badge badge-training">Step 2: Sentence Insertion Challenge</span><br><br>${lvl.fillPrompt}`;
        view.appendChild(block);

        lvl.fillOptions.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.innerText = `${idx + 1}. ${opt}`;
            btn.onclick = () => {
                if (idx === lvl.fillCorrect) {
                    alert("Xuất sắc! Prerequisites clear. Spawning world coordinates...");
                    activePhase = "world_story";
                    activeStoryNode = "start";
                    runEngineTick();
                } else {
                    alert("Chưa đúng! Check word categories and semantic contextual flow variables.");
                }
            };
            panel.appendChild(btn);
        });
    }

    function executeStoryLayout(lvl) {
        let node = lvl.story[activeStoryNode];
        let block = document.createElement('div');
        block.className = "story-text";
        block.innerHTML = `<span class="badge ${lvl.levelNum === 4 ? 'badge-bonus' : 'badge-world'}">${lvl.levelNum === 4 ? 'Bonus Checkpoint' : 'Step 3: Branching Narrative'}</span><br><br>${node.text}`;
        view.appendChild(block);

        node.choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.innerText = choice.text;
            btn.onclick = () => {
                if (choice.target === "next_level_advance") {
                    activeIndex++;
                    localStorage.setItem('saigon_quest_level', activeIndex);
                    activePhase = "training_match";
                    runEngineTick();
                } else if (choice.target === "loop_reset" || choice.target === "campaign_restart") {
                    activeIndex = 0;
                    localStorage.setItem('saigon_quest_level', activeIndex);
                    activePhase = "training_match";
                    runEngineTick();
                } else {
                    activeStoryNode = choice.target;
                    runEngineTick();
                }
            };
            panel.appendChild(btn);
        });
    }

    // Fire state recovery tracking engine on load sequence completion
    initProgressSaveState();
</script>
</body>
</html>
