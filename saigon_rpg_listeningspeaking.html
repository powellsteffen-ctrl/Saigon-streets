<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saigon Chronicles: Immersion Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b13;
            color: #e2e2e2;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .game-container {
            width: 100%;
            max-width: 550px;
            background-color: #161624;
            border: 3px solid #00fff5;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
        }
        h2 { text-align: center; color: #00fff5; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        .stat-panel {
            background-color: #0b0b13;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #22223b;
            display: flex;
            justify-content: space-between;
        }
        .stat-value { font-weight: bold; color: #00fff5; }
        .btn {
            background-color: #00fff5;
            color: #161624;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 15px;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .btn:hover { background-color: #fff; box-shadow: 0 0 10px #00fff5; }
        .audio-btn {
            background-color: #ff5270;
            color: white;
            padding: 8px;
            margin-bottom: 10px;
            text-transform: none;
            font-size: 14px;
        }
        .audio-btn:hover { background-color: #ff758f; box-shadow: 0 0 10px #ff5270;}
        .story-box {
            background-color: #0b0b13;
            border-left: 4px solid #00fff5;
            padding: 18px;
            min-height: 140px;
            margin-bottom: 20px;
            border-radius: 4px;
            line-height: 1.6;
            font-size: 16px;
        }
        .choice-container { display: flex; flex-direction: column; gap: 10px; }
        .choice-btn {
            background-color: #22223b;
            color: #e2e2e2;
            border: 1px solid #00fff5;
            text-align: left;
            text-transform: none;
            font-weight: normal;
        }
        .choice-btn:hover { background-color: #00fff5; color: #161624; }
        .success-text { color: #00ff87; font-weight: bold; }
        .fail-text { color: #ff5270; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>🛵 Saigon Immersion</h2>
        
        <div class="stat-panel">
            <div>🔋 Stamina: <span id="stat-energy" class="stat-value">100</span>%</div>
            <div>🏆 Score: <span id="stat-score" class="stat-value">0</span></div>
        </div>

        <button class="btn" onclick="nextEncounter()">✨ Tiếp Tục (Next Encounter)</button>
        <button class="btn audio-btn" id="speak-btn" onclick="speakCurrentStory()" style="display:none;">🔊 Nghe lại (Listen Again)</button>

        <div class="story-box" id="story-text">
            Chào mừng bạn! Trò chơi này hoàn toàn bằng tiếng Việt. Nếu chọn đúng, bạn sẽ nhận được thể lực (Stamina). Nếu chọn sai, hệ thống sẽ giải thích bằng tiếng Anh. Click ở trên để bắt đầu!
        </div>

        <div class="choice-container" id="choices-box"></div>
    </div>

    <script>
        let energy = 100;
        let score = 0;
        let currentSpeechText = "";

        const encounters = [
            {
                type: "reading",
                story: "Bạn đang ở trung tâm tiếng Anh. Sếp của bạn đi vào phòng và muốn bạn đổi giờ dạy cho học kỳ mới vì có một bé gái mới nhập học. Bạn nên trả lời thế nào để chuyên nghiệp nhất?",
                choices: [
                    { text: "Dạ được, để em xem lại thời gian rồi báo sếp nha.", isCorrect: true, feedback: "Chính xác! Bạn rất chuyên nghiệp. Sếp đánh giá cao chất lượng làm việc của bạn." },
                    { text: "Không được, em muốn nghỉ hè và đi chơi sông ở Mũi Né.", isCorrect: false, feedback: "Wrong approach! You refused your boss bluntly while asking for summer break (nghỉ hè). This damages your workplace score." }
                ]
            },
            {
                type: "listening",
                story: "Hãy nghe kỹ cụm từ sau đây và chọn ý nghĩa đúng nhất của nó.",
                audioText: "Thay nhớt với bơm bánh xe dùm con nha Chú",
                choices: [
                    { text: "You are asking an older mechanic to change your oil and pump your tires.", isCorrect: true, feedback: "Xuất sắc! Bạn nghe rất tốt. Cụm từ 'dùm con' rất phù hợp khi nói chuyện với Chú sửa xe." },
                    { text: "You are asking a colleague to modify your classroom lesson plan.", isCorrect: false, feedback: "Incorrect. 'Thay nhớt' means oil change and 'bánh xe' means tires. You mixed up a mechanic run with school administration!" }
                ]
            },
            {
                type: "reading",
                story: "Hôm qua bạn bị ngộ độc thực phẩm nặng. Hôm nay đi học lại, đồng nghiệp hỏi thăm sức khỏe của bạn. Bạn muốn nói bạn vẫn còn hơi mệt nhưng sẽ cố gắng dạy học.",
                choices: [
                    { text: "Em vẫn hơi mệt nhưng em sẽ cố gắng dạy học nha.", isCorrect: true, feedback: "Tuyệt vời! Từ 'vẫn' và 'cố gắng' được dùng rất tự nhiên trong ngữ cảnh này." },
                    { text: "Em trúng thực nên em muốn đi về ngủ bải học bồi học.", isCorrect: false, feedback: "Tone trap triggered! 'Bài học' means lesson material, and accidentally confusing tones here causes linguistic confusion or introduces accidental vulgarities." }
                ]
            },
            {
                type: "listening",
                story: "Nghe Chú sửa xe hỏi bạn sau khi sửa xong xe máy ở Bình Thạnh:",
                audioText: "Của con hết bốn mươi nghìn, lấy đồ chua không?",
                choices: [
                    { text: "He is asking you for 40,000 VND and joking about pickled vegetables.", isCorrect: true, feedback: "Đúng rồi! Bạn đã bắt được từ 'bốn mươi nghìn' (40k) và 'đồ chua'." },
                    { text: "He is asking you to change the oil filter immediately.", isCorrect: false, feedback: "Incorrect. He was stating the total price ('bốn mươi nghìn') and throwing in a casual food reference." }
                ]
            },
            {
                type: "reading",
                story: "Bạn đi nhậu với đồng nghiệp ở Bình Thạnh. Bạn muốn gọi thêm một đĩa tóp mỡ và dặn phục vụ cho thêm nước tương.",
                choices: [
                    { text: "Cho em một đĩa tóp mỡ, thêm nước tương nha anh.", isCorrect: true, feedback: "Quá ngon! Bạn gọi món rất chuẩn Sài Gòn. Thể lực của bạn tăng lên!" },
                    { text: "Em muốn sử dụng nước tương trên cái bánh xe này.", isCorrect: false, feedback: "Linguistic error! You used 'sử dụng' (formal documentation use) instead of casual 'xài/cho em', and asked to put soy sauce on a wheel ('bánh xe')!" }
                ]
            }
        ];

        // Built-in browser text-to-speech engine
        // UPGRADED SOUTHERN VOICE ENGINE
function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); 
        let utterance = new SpeechSynthesisUtterance(text);
        
        // 1. Fetch all available native voice patches on your phone/computer
        let voices = window.speechSynthesis.getVoices();
        
        // 2. Scan the device for a dedicated Ho Chi Minh City / Southern engine
        // On modern Android/iOS systems, this is often named "Linh" or contains "South"
        let southernVoice = voices.find(voice => 
            voice.lang.includes('vi') && 
            (voice.name.toLowerCase().includes('south') || voice.name.toLowerCase().includes('hcmc'))
        );
        
        if (southernVoice) {
            utterance.voice = southernVoice; // 🌟 Locks in the Saigon Accent!
        } else {
            utterance.lang = 'vi-VN'; // Fallback to standard Vietnamese if no specific region is downloaded
        }
        
        utterance.rate = 0.85; // Keeps the speed slow enough to track the "Saigon Slur"
        window.speechSynthesis.speak(utterance);
    }
}

// Crucial: Browsers load voices asynchronously, this line ensures they load immediately on page refresh
window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        function speakCurrentStory() {
            if (currentSpeechText) {
                speak(currentSpeechText);
            }
        }

        function nextEncounter() {
            if (energy <= 0) {
                document.getElementById("story-text").innerHTML = "<span class='fail-text'>GAME OVER!</span> Bạn đã hết thể lực vì thức khuya. Hãy xin sếp nghỉ hè hoặc lấy một ngày nghỉ để hồi phục!";
                document.getElementById("choices-box").innerHTML = "";
                document.getElementById("speak-btn").style.display = "none";
                return;
            }

            const randomIdx = Math.floor(Math.random() * encounters.length);
            const scene = encounters[randomIdx];

            document.getElementById("story-text").innerHTML = scene.story;
            
            // Handle audio/listening configurations
            if (scene.type === "listening") {
                currentSpeechText = scene.audioText;
                document.getElementById("speak-btn").style.display = "block";
                // Trigger auto-play for listening challenges
                setTimeout(() => { speak(scene.audioText); }, 300);
            } else {
                currentSpeechText = scene.story.replace(/<[^>]*>/g, ''); // strip HTML tags
                document.getElementById("speak-btn").style.display = "block";
            }
            
            let choicesHTML = "";
            scene.choices.forEach((choice, index) => {
                choicesHTML += `<button class="btn choice-btn" onclick="chooseOption(${randomIdx}, ${index})">👉 ${choice.text}</button>`;
            });
            document.getElementById("choices-box").innerHTML = choicesHTML;
        }

        function chooseOption(sceneIdx, choiceIdx) {
            const selected = encounters[sceneIdx].choices[choiceIdx];
            document.getElementById("speak-btn").style.display = "none";
            
            if (selected.isCorrect) {
                score += 20;
                energy += 10; // Stamina goes UP or regenerates on correct answers
                if (energy > 100) energy = 100;
                
                document.getElementById("story-text").innerHTML = `<span class='success-text'>Chính xác! 🎉</span><br><br>${selected.feedback}`;
            } else {
                score -= 5;
                energy -= 25; // Stamina drops heavily on mistakes
                if (energy < 0) energy = 0;
                
                document.getElementById("story-text").innerHTML = `<span class='fail-text'>Sai rồi! ❌</span><br><br>${selected.feedback}`;
            }
            
            document.getElementById("stat-energy").innerText = energy;
            document.getElementById("stat-score").innerText = score;
            document.getElementById("choices-box").innerHTML = "";
        }
    </script>
</body>
</html>
